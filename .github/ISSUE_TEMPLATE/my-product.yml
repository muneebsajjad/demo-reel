name: My product
description: You tried demo-reel on a product. Tell us what got in the way.
labels: ["field report"]
body:
  - type: input
    id: product
    attributes:
      label: What kind of product?
      placeholder: "Web app with login / Chrome extension / canvas app / docs site / ..."
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What did you want the video to show?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where did it go wrong?
      description: Commands you ran, what happened, and a still or frame if it is visual.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `reel doctor`
      render: text
