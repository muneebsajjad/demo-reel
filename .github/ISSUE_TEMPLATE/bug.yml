name: Bug
description: Something is broken.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or command
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `reel doctor`
      render: text
